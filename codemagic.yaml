workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - bonbon-clean
        certificates:
          - bonbon-distribution

    scripts:
      - name: Flutter clean
        script: |
          flutter clean
          flutter pub get

      - name: Reset CocoaPods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Apply iOS signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true